<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste Supabase | Fidelização</title>
<h1>Teste de conexão com o Supabase</h1>
<p>Entre com um usuário do Supabase Auth cadastrado como ativo em perfis.</p>
<p>Versão corrigida · servidor: <code>fqetzdaansqgbgvavrrg.supabase.co</code></p><form id="teste">
  <label>E-mail <input name="email" type="email" autocomplete="username" required></label>
  <label>Senha <input name="senha" type="password" autocomplete="current-password" required></label>
  <button>Testar</button>
</form>
<pre id="resultado" role="status"></pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const form = document.getElementById('teste');
const resultado = document.getElementById('resultado');
const botao = form.querySelector('button');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  botao.disabled = true;
  resultado.textContent = 'Consultando…';
  let banco;
  try {
    if (!window.supabase) throw new Error('Não foi possível carregar a biblioteca do Supabase.');
    banco = window.supabase.createClient("https://fqetzdaansqgbgvavrrg.supabase.co", "sb_publishable_x7KhQWrsA1ov5KubzFwjfA_agcv70NA", {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
    });
    const { error: erroLogin } = await banco.auth.signInWithPassword({
      email: form.elements.email.value.trim(),
      password: form.elements.senha.value
    });
    if (erroLogin) throw erroLogin;
    const { data: perfil, error: erroPerfil } = await banco.from('perfis')
      .select('ativo').maybeSingle();
    if (erroPerfil) throw erroPerfil;
    if (!perfil?.ativo) throw new Error('O usuário precisa de um perfil ativo.');
    const linhas = [];
    for (const tabela of ['demandas', 'demanda_eventos', 'importacoes', 'demandas_finalizadas']) {
      const { error } = await banco.from(tabela).select('id', { head: true }).limit(1);
      if (error) throw new Error(tabela + ': ' + error.message);
      linhas.push(tabela + ': consulta OK');
    }
    resultado.textContent = linhas.join('\n');
  } catch (erro) {
    resultado.textContent = 'Falha: ' + erro.message;
  } finally {
    form.elements.senha.value = '';
    botao.disabled = false;
  }
});
</script>
</html>
